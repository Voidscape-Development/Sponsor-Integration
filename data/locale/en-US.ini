PictureGallery.Name="Picture Gallery"
PictureGallery.Files="Images"

PictureGallery.Group.Playback="Playback"
PictureGallery.HoldTime="Hold time"
PictureGallery.HoldTime.Desc="How long each image stays fully on screen. Transitions come on top of this."
PictureGallery.GapTime="Gap between images"
PictureGallery.GapTime.Desc="With a gap, each image goes out with the Hide transition, the gallery stays\nempty for this long, and the next image comes in with the Show transition.\n0 moves straight from one image to the next with the Normal transition."
PictureGallery.Loop="Loop gallery"
PictureGallery.Shuffle="Shuffle order"
PictureGallery.HideWhenDone="Hide when the gallery ends"
PictureGallery.RestartOnShow="Restart gallery when the source becomes visible"

PictureGallery.Group.Normal="Normal transition (image → image)"
PictureGallery.Group.Normal.Desc="Plays between one image and the next when there is no gap."
PictureGallery.Group.Show="Show transition (nothing → image)"
PictureGallery.Group.Show.Desc="Brings the gallery in: when the source becomes visible, when it is started or\nshown again, and after the gap between images."
PictureGallery.Group.Hide="Hide transition (image → nothing)"
PictureGallery.Group.Hide.Desc="Takes the gallery out: into the gap between images, on Stop, on the Hide\ncontrol, and at the end of a gallery that hides when it ends."
PictureGallery.Group.Wrap="Loop wrap transition (last → first)"
PictureGallery.Group.Wrap.Desc="Plays when a looping gallery goes from its last image back to its first.\nWith a gap set, it brings the first image in after the gap instead of the Show transition."

PictureGallery.Transition="Transition"
PictureGallery.Transition.Same="Same as the normal transition"
PictureGallery.Transition.Scene="OBS scene transition"
PictureGallery.Transition.SceneName="Scene transition"
PictureGallery.Transition.SceneName.Desc="One of the transitions set up in the Scene Transitions dock. The gallery\nplays its own copy with the same settings and follows changes made to them."
PictureGallery.Transition.SceneName.Missing="(not found)"
PictureGallery.Transition.Duration="Duration"

