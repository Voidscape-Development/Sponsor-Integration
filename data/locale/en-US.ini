PictureGallery.Name="Picture Gallery"
PictureGallery.Files="Images"

PictureGallery.Group.Playback="Playback"
PictureGallery.HoldTime="Hold time"
PictureGallery.HoldTime.Desc="How long each image stays fully on screen. Transitions come on top of this."
PictureGallery.GapTime="Gap between images"
PictureGallery.GapTime.Desc="With a gap, each image goes out with the Hide transition, the gallery stays\nempty for this long, and the next image comes in with the Show transition.\nWith 0, the next image comes in with Show while the last goes out with Hide."
PictureGallery.Loop="Loop gallery"
PictureGallery.Shuffle="Shuffle order"
PictureGallery.HideWhenDone="Hide when the gallery ends"
PictureGallery.RestartOnShow="Restart gallery when the source becomes visible"
PictureGallery.EdgesOnly="Use Show/Hide only when the gallery comes in or goes out"
PictureGallery.EdgesOnly.Desc="Like the Source Switcher plugin: images change with the Normal transition,\nand Show/Hide only play when the gallery comes in from or goes out to nothing -\nstarting, the Show/Hide controls, Stop, and around the gap between images.\nOff, every image comes in with Show and goes out with Hide."

PictureGallery.Group.Normal="Normal transition (image → image)"
PictureGallery.Group.Normal.Desc="Goes straight from one image to the next when Show and Hide are both None\n(or always, with Show/Hide used only when the gallery comes in or goes out).\nAlso stands in for Show or Hide set to None when the gallery comes in from or\ngoes out to nothing. None here is a cut."
PictureGallery.Group.Show="Show transition (→ image)"
PictureGallery.Group.Show.Desc="Brings each image in: as it replaces the last one, when the source becomes\nvisible, when the gallery is started or shown again, and after the gap.\nNone: the image just appears under the outgoing one (Hide set), or the Normal\ntransition is used."
PictureGallery.Group.Hide="Hide transition (image →)"
PictureGallery.Group.Hide.Desc="Takes each image out: as the next one replaces it (drawn on top of it), into\nthe gap, on Stop, on the Hide control, and at the end of a gallery that hides\nwhen it ends. None: the next image's Show plays straight from it, or the\nNormal transition is used."
PictureGallery.Group.Wrap="Loop wrap transition (→ first image)"
PictureGallery.Group.Wrap.Desc="Brings the first image in again when a looping gallery goes from its last\nimage back to its first, in place of the Show transition (or the Normal one,\nwith Show/Hide used only when the gallery comes in or goes out). None: no\nspecial transition at the loop point."

