AdPlaylist.Group.Audio="Audio"
AdPlaylist.Volume="Volume"
AdPlaylist.Volume.Desc="Level of the whole playlist, applied before the fader in the OBS audio mixer."
AdPlaylist.Normalize="Even out loudness between items"
AdPlaylist.Normalize.Desc="Measures how loud each file is (ITU-R BS.1770 / EBU R128) and turns quiet\nspots up and loud spots down toward the target, so the rotation plays at one\neven level. A file is measured while it plays and remembered afterwards, so\nit starts at the right level the next time it comes around."
AdPlaylist.Normalize.Target="Target loudness"
AdPlaylist.Normalize.Target.Desc="The level every item is brought toward. -18 LUFS sits comfortably under game\naudio and voice; raise it toward -14 for a louder rotation."
AdPlaylist.Normalize.MaxBoost="Maximum boost"
AdPlaylist.Normalize.MaxBoost.Desc="How far a quiet file may be turned up. Keeps near-silent files and their\nbackground noise from being blown up. Boosting never pushes a file into clipping."

